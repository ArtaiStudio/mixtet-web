// MARK: - fader law (stejné jako XAirCodec)
const lin = f => { if (f <= 0) return -Infinity; if (f >= .5) return f*40-30; if (f >= .25) return f*80-50; if (f >= .0625) return f*160-70; return f*480-90; };
const q = f => Math.floor(Math.min(1, Math.max(0, f)) * 1023.5) / 1023;
const dbf = d => { if (d <= -90) return 0; let f; if (d >= -10) f = (d+30)/40; else if (d >= -30) f = (d+50)/80; else if (d >= -60) f = (d+70)/160; else f = (d+90)/480; return q(f); };
const dbt = d => { if (!isFinite(d) || d < -89.5) return '−∞'; const r = Math.round(d * 10) / 10 || 0; return (r > 0 ? '+' : r < 0 ? '−' : '') + Math.abs(r).toFixed(1); };
const TOL = 0.007;        // sendy mají 161 kroků → shoda echa v toleranci jednoho kroku
const buzz = ms => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };

function groupDb(list){ let m = -Infinity; for (const s of list) { const v = V[s.addr] || 0; if (v > 0) m = Math.max(m, lin(v)); } return m; }
/* skupiny ±15 dB (4.10): střed C = uložený odposlech člena (server `center`), bez uloženého stav při prvním načtení.

let C = {};

const cdb = a => (C[a] !== undefined && isFinite(C[a]) && C[a] > -89.5) ? C[a] : null;

function groupOff(list){ const l = groupLive(list); if (!l.length) return 0;
  return Math.round(l.reduce((n, s) => n + lin(V[s.addr]) - cdb(s.addr), 0) / l.length * 10) / 10; }

function setCenter(fromSaved){
  const src = fromSaved && Object.keys(fromSaved).length ? fromSaved : (Object.keys(C).length ? null : cfg.values);
  if (!src) return;   // po obnově spojení bez uloženého odposlechu zůstává střed z prvního načtení

}
function toCenter(list){

  const l = groupLive(list); if (!l.length) return;
  pushUndo(l.map(s => ({a: s.addr, v: V[s.addr]})));
  for (const s of l) setVal(s.addr, dbf(Math.min(10, cdb(s.addr))), true);
}

// MARK: - posuvník: relativní tah, jemný krok odtažením prstu kolmo (×¼ / ×⅒), klávesnice ±1 dB / ±6 dB; vert = svislý pás
function slider(id, label, getDb, applyDelta, color, vert, range){
  const sl = document.createElement('div'); sl.className = 'sl' + (vert ? ' v' : ''); sl.id = id; sl.tabIndex = 0;
  // range [od, do] = lineární stupnice posunu skupiny (4.10), jinak zákon faderu −∞…+10 dB
  const pos = d => range ? Math.min(1, Math.max(0, (d - range[0]) / (range[1] - range[0]))) : (isFinite(d) ? dbf(d) : 0);
  const ticks = range ? [-15, -10, -5, 0, 5, 10, 15].map(d => [d, d === 0 ? ' zero' : '']) : TICKS;
  sl.setAttribute('role', 'slider'); sl.setAttribute('aria-label', label);
  sl.setAttribute('aria-valuemin', range ? range[0] : '-90'); sl.setAttribute('aria-valuemax', range ? range[1] : '10');
  if (vert) sl.setAttribute('aria-orientation', 'vertical');
  if (color) sl.style.setProperty('--cc', color);
  sl.innerHTML = '<div class="slot"></div>' + ticks.map(([db, cls]) => `<i class="tk${cls}" style="${vert ? 'bottom' : 'left'}:${along(pos(db), true)}"></i>`).join('') + '<div class="cap"></div>';
  let x0 = 0, y0 = 0, xs = 0, ys = 0, acc = 0, active = false, pending = false, lpTimer = 0;
  /* zámek osy (3.4): dotyk se jezdce chytí, až když jde prst víc do strany jezdce (> 8 px) – jinak stránka roluje */
  const engage = ev => { pending = false; clearTimeout(lpTimer); active = true; x0 = ev.clientX; y0 = ev.clientY; acc = 0;
    try { sl.setPointerCapture(ev.pointerId); } catch (e) {} applyDelta(0, 'start'); };
  sl.addEventListener('pointerdown', ev => { if (!online()) { offline(); return; }
    xs = ev.clientX; ys = ev.clientY; sl.focus({preventScroll: true});
    clearTimeout(lpTimer); lpTimer = setTimeout(() => { if (pending) { pending = false; longPressMenu(sl, getDb, applyDelta); } }, 500);
    if (ev.pointerType === 'mouse') { engage(ev); ev.preventDefault(); } else pending = true; });
  sl.addEventListener('pointermove', ev => {
    if (pending) {
      const dx = Math.abs(ev.clientX - xs), dy = Math.abs(ev.clientY - ys), along = vert ? dy : dx, across = vert ? dx : dy;
      if (along > 8 && along > across) engage(ev);
      else if (across > 8) { pending = false; clearTimeout(lpTimer); }   // roluje se stránka
      return;
    }
    if (!active) return;
    const off = vert ? Math.abs(ev.clientX - xs) : Math.abs(ev.clientY - ys); const k = off > 140 ? .1 : off > 50 ? .25 : 1;
    sl.dataset.fine = k < 1 ? (k === .1 ? '×⅒' : '×¼') : '';
    if (vert) { acc -= (ev.clientY - y0) / Math.max(1, sl.clientHeight) * 70 * k; y0 = ev.clientY; }
    else { acc += (ev.clientX - x0) / Math.max(1, sl.clientWidth) * 70 * k; x0 = ev.clientX; }
    applyDelta(acc, 'move'); });
  const end = () => { pending = false; clearTimeout(lpTimer); if (!active) return; active = false; sl.dataset.fine = ''; applyDelta(acc, 'end'); };
  sl.addEventListener('pointerup', end); sl.addEventListener('pointercancel', end); sl.addEventListener('lostpointercapture', end);
  sl.addEventListener('keydown', ev => { const s = {ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1, PageUp: 6, PageDown: -6}[ev.key];
    if (!s) return; ev.preventDefault(); if (!online()) return offline(); applyDelta(0, 'start'); applyDelta(s, 'end'); });
  const cap = sl.querySelector('.cap');
  sl._paint = () => { const d = getDb(); const f = pos(d);
    cap.style[vert ? 'bottom' : 'left'] = along(f, false);
    sl.setAttribute('aria-valuenow', isFinite(d) ? Math.round(d) : -90);
    sl.setAttribute('aria-valuetext', range ? offText(d) : isFinite(d) ? dbt(d) + ' dB' : t('silent')); };
  return sl;
}
/* podržení jezdce (3.4): 0 dB / −∞ / Vrátit – vždy existuje i viditelná cesta (± a Vrátit dole), tohle je zkratka */
function longPressMenu(sl, getDb, apply){
  document.querySelectorAll('.lp').forEach(e => e.remove());
  const m = document.createElement('div'); m.className = 'lp'; m.setAttribute('role', 'menu');
  const item = (txt, fn) => { const b = document.createElement('button'); b.textContent = txt; b.setAttribute('role', 'menuitem');
    b.onclick = () => { m.remove(); if (!online()) return offline(); fn(); }; m.append(b); };
  item('0 dB', () => { const d = getDb(); apply(0, 'start'); apply(isFinite(d) ? -d : 61, 'end'); });
  item('−∞', () => { apply(0, 'start'); apply(-200, 'end'); });
  item(t('undoAct'), () => doUndo());
  const r = sl.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(innerWidth - 260, r.left)) + 'px';
  m.style.top = Math.max(8, r.top - 56) + 'px';
  document.body.append(m); buzz(15); m.querySelector('button').focus();
  setTimeout(() => addEventListener('pointerdown', function off(e){ if (!m.contains(e.target)) { m.remove(); removeEventListener('pointerdown', off, true); } }, true), 0);
}
/* poloha na dráze: jezdec nikdy nepřečnívá (jako na Macu); tick = střed jezdce */
const along = (f, center) => `calc(${center ? 'var(--capl) / 2 + ' : ''}(100% - var(--capl)) * ${f.toFixed(4)})`;
/* rysky stupnice jako na Macu (FaderControl.marks / minor); 0 dB zvýrazněná */
const TICKS = [10, 5, 0, -5, -10, -20, -30, -50].map(d => [d, d === 0 ? ' zero' : '']).concat([7.5, 2.5, -2.5, -7.5, -15, -25, -40, -60].map(d => [d, ' mi']));
function nudgeBtn(label, fn){ const b = document.createElement('button'); b.className = 'nb'; b.textContent = label === '+' ? '+' : '−'; b.setAttribute('aria-label', label === '+' ? '+1 dB' : '−1 dB'); b.onclick = fn; return b; }
function nudges(row, sl, apply){ row.append(nudgeBtn('-', () => { if (!online()) return offline(); apply(0, 'start'); apply(-1, 'end'); }), sl, nudgeBtn('+', () => { if (!online()) return offline(); apply(0, 'start'); apply(1, 'end'); })); }

/* skupina: relativně, nahoru jen tak, aby nikdo nepřetekl +10 dB – poměr zůstane; dolů nejníž −60 dB */
function groupApply(id, list){
  let base = null;
  return (delta, phase) => {
    if (!list.length) return;
    if (phase === 'start' || !base) { base = list.filter(s => kn(s.addr)).map(s => ({a: s.addr, d: lin(V[s.addr])})); pushUndo(base.map(x => ({a: x.a, v: V[x.a]}))); dragging.add(id); }
    if (phase === 'start') return;
    // každý kanál od své hodnoty o stejně dB, ale nejvýš ±15 dB od středu (4.10); strop +10, dno −60
    const live = base.filter(x => isFinite(x.d) && x.d > -89.5 && cdb(x.a) !== null);
    for (const x of live) { const c = cdb(x.a);
      setVal(x.a, dbf(Math.max(-60, Math.min(10, c + GROUP_RANGE[1], Math.max(c + GROUP_RANGE[0], x.d + delta)))), true); }
    if (phase === 'end') { base = null; dragging.delete(id); buzz(8); }
  };
}
function oneApply(addr){
  let base = null;
  return (delta, phase) => {
    if (!kn(addr)) return;   // neznámou hodnotu nejde měnit (zákon 2)
    if (phase === 'start' || base == null) { base = lin(V[addr] || 0); if (!isFinite(base)) base = -61; pushUndo([{a: addr, v: V[addr] || 0}]); dragging.add(addr); }
    if (phase === 'start') return;
    setVal(addr, dbf(Math.min(10, Math.max(-90, base + delta))), true);
    if (phase === 'end') { base = null; dragging.delete(addr); buzz(8); }
  };
}

function metersStale(){ return !online() || Date.now() - lastM > 1500; }
/* Pojistka uší (4.2): kolik právě ubírá; nad 6 dB rada ztišit si odposlech */
let GR = 0, grAt = 0;
function paintGR(){ const e = $('grSt'); if (!e) return;
  const fresh = Date.now() - grAt < 2000 && online();
  e.hidden = !fresh || GR < 0.5;
  e.classList.toggle('warn', fresh && GR > 6);
  e.textContent = fresh && GR >= 0.5 ? (GR > 6 ? t('grLoud', GR.toFixed(0)) : t('grOn', GR.toFixed(1))) : ''; }
setInterval(paintGR, 1000);
/* špička drží 1,5 s, pak padá s měřákem; clip (0 dBFS) = červená tečka u jména 5 s (4.4) */
const PEAK_HOLD = 1500, CLIP_SHOW = 5000;
function paintMeters(){
  const stale = metersStale(), now = Date.now();
  for (const k in W) { const e = W[k]; if (!e.mt) continue; e.mt.classList.toggle('stale', stale);
    const box = e.mt.closest('.ch, .big');
    if (stale) { if (box) box.classList.remove('clip'); continue; }
    const db = M[e.meter]; if (db == null) continue; const i = e.mt.querySelector('i'); const fr = Math.max(0, Math.min(1, (db + 60) / 60));
    if (!e.pk || fr >= e.pk.fr || now - e.pk.t > PEAK_HOLD) e.pk = {fr, t: now};
    let b = e.mt.querySelector('b'); if (!b) { b = document.createElement('b'); e.mt.append(b); }
    if (db >= -0.5) e.clipAt = now;
    if (box) box.classList.toggle('clip', !!e.clipAt && now - e.clipAt < CLIP_SHOW);
    if (e.mt.classList.contains('v')) { const h = e.mt.clientHeight; i.style.setProperty('--h', h + 'px'); i.style.height = fr * h + 'px'; b.style.bottom = e.pk.fr * h + 'px'; }
    else { const w = e.mt.clientWidth; i.style.setProperty('--w', w + 'px'); i.style.width = fr * w + 'px'; b.style.left = e.pk.fr * w + 'px'; } }
}

/* MLUVIT KE KAPELE: jen když ho server nabízí (cfg.talk). Uvolní se při ztrátě fokusu / skrytí stránky (zákon 7). */
function bindHold(b){
  let hb = 0;   // drží → obnovit každou 1 s; bez obnovení server MLUVIT pustí do 2 s (zhasnutý mobil, ztracená Wi‑Fi)
  const paint = v => { b.classList.toggle('lit', v); b.setAttribute('aria-pressed', v); b.textContent = v ? t('talking') : t('talk'); };
  const on = v => { paint(v); clearInterval(hb); hb = 0;
    post('talk', {on: v}).then(r => { if (v && b.classList.contains('lit') && !(r && r.ok)) { paint(false); clearInterval(hb); hb = 0; toast(t('tTalkBusy'), {err: true}); } });
    if (v) hb = setInterval(() => post('talk', {on: true}), 1000); };
  b.setAttribute('aria-pressed', 'false');
  b.addEventListener('pointerdown', e => { if (!online()) return offline(); e.preventDefault(); b.setPointerCapture(e.pointerId); on(true); });
  const up = () => { if (b.classList.contains('lit')) on(false); };
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('blur', up);
  b.addEventListener('click', e => { if (e.detail === 0) on(!b.classList.contains('lit')); });   // VoiceOver / klávesnice přepíná

  PF.busy = true; $('pErr').className = 'perr info'; $('pErr').textContent = t('checking');
  const r = await claim(PF.pin); PF && (PF.busy = false);
  if (!r) return;                                                // spárováno nebo jiná obrazovka
  PF.pin = ''; paintPin();
  const e = $('pErr'); e.className = 'perr';
  if (r.locked) { lockPin(r.locked); return; }
  e.textContent = r.net ? t('hubDown', hubName()) : t('pinWrong', r.left);
  buzz(60);
}
function lockPin(s){
  let left = Math.max(1, Math.round(s)); pinLock(true); const e = $('pErr'); e.tabIndex = -1; e.focus({preventScroll: true});   // fokus nesmí zůstat na zamčené klávese
  const paint = () => { e.textContent = t('pinLocked', left); };
  paint(); clearInterval(pinTimer);
  pinTimer = setInterval(() => { left--; if (!$('pErr')) { clearInterval(pinTimer); return; }
    if (left <= 0) { clearInterval(pinTimer); pinLock(false); e.className = 'perr info'; e.textContent = t('canRetry'); const k = document.querySelector('.keys button'); if (k) k.focus({preventScroll: true}); } else paint(); }, 1000);
}
document.addEventListener('keydown', ev => {
  if (!PF || !document.querySelector('.keys') || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (/^[0-9]$/.test(ev.key)) { ev.preventDefault(); if (!document.querySelector('.keys button:disabled')) pinKey(ev.key); }
  else if (ev.key === 'Backspace') { ev.preventDefault(); pinKey('del'); }
});
/* Spárovat: server vrátí klíč mobilu (session); adresa se přepíše na /m/<session> – funguje i z plochy */
async function claim(pin){
  return claimResult(await call(keyPath(PF.code) + '/claim', pin == null ? {device: deviceName()} : {pin, device: deviceName()}), pin);
}
function claimResult(r, pin){
  if (r.j && r.j.ok && r.j.session) {
    PF.session = r.j.session; saveSession({session: r.j.session, bus: PF.info.bus, name: PF.info.name});
    try { history.replaceState(null, '', '/m/' + r.j.session + langQ()); } catch (e) {}
    if (PF.info.strips && PF.info.strips.length) mineScreen(); else doneScreen();
    return null;
  }
  if (r.s === 0) { if (pin == null) toast(t('hubDownToast', hubName()), {err: true}); return {net: true}; }
  const st = r.j && r.j.state;
  if (st === 'pin') { if (pin == null) { PF.info.pin = true; PF.steps++; pinScreen(); return null; } return {left: r.j.left}; }
  if (st === 'locked') { if (pin == null) { errScreen('locked', () => claim(null), r.j.retryIn); return null; } return {locked: r.j.retryIn || 30}; }
  if (st === 'wait') { waitScreen(pin, r.j.ticket, r.j.retryIn); return null; }
  if (st === 'denied') { errScreen('denied'); return null; }
  errScreen(st === 'expired' ? 'expired' : 'unknown'); return null;
}
/* Povolit na hubu (cizí síť): mobil čeká, až kapelník ťukne na Povolit; ptá se znovu po pár sekundách, nejdéle 2 min */
function waitScreen(pin, ticket, every){
  const i = PF.info, n = nm(i.name) || t('busFallback', i.bus), t0 = Date.now(), my = PF;
  REDRAW = () => { if (PF === my && PF.wait === t0) { clearTimeout(PF.waitT); waitScreen(pin, ticket, every); } };
  screen({title: t('waitTitle'), h: text(t('waitH')),
    lead: t('waitLead', hubName(), n, deviceName()),
    body: item('lock', t('waitItem'), t('waitItemSub'), false),
    alt: [t('cancel'), () => { PF.wait = 0; whoScreen(); }]});
  const tick = async () => {
    if (PF !== my || PF.wait !== t0) return;
    if (Date.now() - t0 > 120000) { errScreen('timeout', () => { PF = my; whoScreen(); }); return; }
    const r = await call(keyPath(PF.code) + '/claim', {ticket, device: deviceName(), pin: pin == null ? undefined : pin});
    if (PF !== my || PF.wait !== t0) return;
    if (r.j && r.j.state === 'wait') { PF.waitT = setTimeout(tick, (r.j.retryIn || every || 2) * 1000); return; }
    if (r.s === 0) { PF.waitT = setTimeout(tick, 3000); return; }
    PF.wait = 0; claimResult(r, pin);
  };
  PF.wait = t0; PF.waitT = setTimeout(tick, (every || 2) * 1000);
}

// 3 · Co je tvoje? (z toho je JÁ; předvyplnil kapelník)
function mineScreen(){
  REDRAW = mineScreen;
  const i = PF.info, chips = el('div', 'chips'); chips.setAttribute('role', 'group'); chips.setAttribute('aria-labelledby', 'pairH');
  const note = el('p', 'perr info'); note.id = 'pNote'; note.setAttribute('role', 'status');
  i.strips.forEach(s => {
    const b = el('button', 'chip', s.name); b.type = 'button'; b.id = 'chip-' + s.id; b.style.setProperty('--cc', chColor(s));
    b.setAttribute('aria-pressed', PF.mine.has(s.id));
    b.onclick = () => { PF.mine.has(s.id) ? PF.mine.delete(s.id) : PF.mine.add(s.id); b.setAttribute('aria-pressed', PF.mine.has(s.id)); paintMine(); };
    chips.append(b);
  });
  const pre = (i.mine || []).length > 0;
  screen({step: stepOf(PF.steps - 1), title: t('mineTitle'), h: text(t('mineTitle')),
    lead: pre ? t('mineLeadPre') : t('mineLead'),
    body: [chips, note], cta: [t('thatsMe'), saveMine]});
  paintMine();
}
function paintMine(){
  const n = PF.mine.size, b = $('pCta');
  $('pNote').textContent = n ? t('picked', n) : t('pickedNone');
  if (b) b.textContent = n ? t('thatsMe') : t('noMe');
}
async function saveMine(){
  if (PF.busy) return; PF.busy = true;   // tlačítko se nezamyká – fokus zůstane na něm
  const r = await call('/api/m/' + encodeURIComponent(PF.session) + '/stars', {stars: [...PF.mine]});
  PF.busy = false;
  if (r.s === 0 || !r.j || r.j.ok === false) { toast(t('hubDownSave', hubName()), {err: true}); return; }
  doneScreen();
}

// 4 · Tři posuvníky + tipy (plocha, displej)
function doneScreen(){
  REDRAW = doneScreen;
  const i = PF.info, strips = i.strips || [];
  const names = list => list.length > 3 ? list.slice(0, 3).join(', ') + t('andMore', list.length - 3) : list.join(', ');
  const mine = strips.filter(s => PF.mine.has(s.id)), clicks = strips.filter(s => !PF.mine.has(s.id) && isClick(s));
  const dl = el('dl', 'legend');
  const row = (label, cc, txt) => { const dt = el('dt'), t = el('span', 'tile', label); t.style.setProperty('--cc', cc); dt.append(t); dl.append(dt, el('dd', '', txt)); };
  row(t('ME'), 'var(--mc)', mine.length ? names(mine.map(s => s.name)) : t('meNone'));
  row(t('BAND'), 'var(--krai-channel-unowned)', t('everyoneElse'));
  if (clicks.length) row(t('CLICK'), 'var(--krai-channel-unowned)', names(clicks.map(s => s.name)));
  const tips = [];
  if (!standalone()) tips.push(item('pin', t('homeTitle'), (isApple() ? t('homeApple') : /Android/.test(navigator.userAgent) ? t('homeAndroid') : t('homeOther')) + t('homeNext')));
  tips.push(item('sun', t('wakeOn'), t('wakeOnSub')));   // wake lock, nebo na http tiché video (9.2)
  screen({step: stepOf(PF.steps), title: t('doneTitle'), h: text(t('doneTitle')),
    lead: t('doneLead') + (i.guard ? t('doneGuard') : ''),
    body: [dl, ...tips], cta: [t('startPlaying'), () => { try { localStorage.setItem('krai-hint-wake', '1'); } catch (e) {} start(PF.session); }]});
}

// Chyby a ruční kód
function errScreen(kind, retry, secs, rest){
  const E = t({expired: 'errExpired', unknown: 'errUnknown', revoked: 'errRevoked', denied: 'errDenied',
    timeout: 'errTimeout', net: 'errNet', locked: 'errLocked'}[kind]);
  if (kind === 'denied' && !retry && PF) { const my = PF; retry = () => { PF = my; whoScreen(); }; }
  const again = kind === 'net' || kind === 'locked' || ((kind === 'denied' || kind === 'timeout') && retry);
  const left0 = rest != null ? rest : Math.max(1, Math.round(secs || 30)), until = Date.now() + left0 * 1000;
  REDRAW = () => errScreen(kind, retry, secs, Math.max(0, Math.round((until - Date.now()) / 1000)));   // odpočet přežije přepnutí jazyka
  // „Moc pokusů“ nemá vlastní větu – podtitul je odpočet (bez něj chyběl text a odpočet spadl na null)
  screen({title: E[0], h: text(E[0]), lead: kind === 'locked' ? t('retryIn', left0) : E[1],
    cta: again ? [t('tryAgain'), retry] : [t('enterCode'), codeScreen],
    alt: again ? [t('enterCode'), codeScreen] : null});
  if (kind === 'locked') {
    let left = left0; const b = $('pCta'), l = document.querySelector('#pair .lead');
    l.setAttribute('role', 'status');
    const paint = () => { l.textContent = left > 0 ? t('retryIn', left) : t('canRetry'); b.disabled = left > 0; };
    paint(); clearInterval(pinTimer);
    if (left > 0) pinTimer = setInterval(() => { left--; paint(); if (left <= 0) clearInterval(pinTimer); }, 1000);
  }
}
function codeScreen(){
  clearInterval(pinTimer);
  REDRAW = () => { const v = $('pCode') ? $('pCode').value : ''; codeScreen(); $('pCode').value = v; };
  const lab = el('label', 'sr', t('codeLabel')); lab.htmlFor = 'pCode';
  const inp = el('input', 'code'); inp.id = 'pCode'; inp.autocomplete = 'off'; inp.spellcheck = false;
  inp.setAttribute('autocapitalize', 'characters'); inp.setAttribute('autocorrect', 'off'); inp.setAttribute('enterkeyhint', 'go');
  const err = el('p', 'perr'); err.id = 'pErr'; err.setAttribute('role', 'status');
  inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); sendCode(); } });
  screen({title: t('codeTitle'), h: text(t('codeH')),
    lead: t('codeLead'),
    body: [lab, inp, err], cta: [t('next'), sendCode], focus: 'pCode'});
}
async function sendCode(){
  const k = cleanKey($('pCode').value), e = $('pErr'), b = $('pCta');
  if (k.length < 6) { e.className = 'perr'; e.textContent = t('code6'); return; }
  if (b.dataset.busy) return; b.dataset.busy = '1'; e.className = 'perr info'; e.textContent = t('checking');
  const r = await call(keyPath(k)); delete b.dataset.busy; e.className = 'perr';
  const st = r.j && r.j.state;
  if (r.s === 0) { e.textContent = t('codeNet'); return; }
  if (st === 'ok') return pairFlow(k, r.j);
  if (st === 'session') { saveSession({session: k, bus: r.j.bus, name: r.j.name}); return start(k); }
  if (st === 'locked') { e.textContent = t('codeLocked', r.j.retryIn || 30); return; }
  e.textContent = st === 'expired' ? t('codeExpired') : t('codeUnknown');
}

paintStatic();
boot();
</script>
