.meter{position:relative;flex:none;width:var(--krai-size-segMeterWidthNarrow);margin:calc(var(--krai-size-capHeightStage) / 2) 0;border-radius:var(--krai-radius-xs);overflow:hidden;
  --hot:calc((var(--krai-meter-db-hot) - var(--krai-meter-db-floor)) / (0 - var(--krai-meter-db-floor)) * 100%);--over:calc((var(--krai-meter-db-over) - var(--krai-meter-db-floor)) / (0 - var(--krai-meter-db-floor)) * 100%);

.val{flex:none;display:grid;place-items:center;height:calc(var(--krai-hit-touch) - var(--krai-space-1));border-radius:var(--krai-radius-sm);background:var(--krai-well);font-size:var(--krai-fs-stage);font-weight:var(--krai-fw-semibold);font-variant-numeric:tabular-nums;white-space:nowrap}

/* tlačítko pultu: nesvítí = gradient s obrysem, svítí = barva významu + záře */

/* mute skupina = nepřímé ztlumení → oranžová (zákon 6), nikdy červená */

/* MARK: spodní lišta – banky a poznámka */

/* MARK: párování */
#pair{flex:1;display:grid;place-items:center;padding:var(--krai-space-5)}
#pair .box{max-width:calc(var(--krai-size-strip-width-stage) * 6);width:100%;display:grid;gap:var(--krai-space-3);background:linear-gradient(var(--krai-strip-top),var(--krai-strip-bottom));border-radius:var(--krai-radius-lg);padding:var(--krai-space-5)}

/* menší iPad (1024 × 768): užší pravý sloupec a Sál; úzké displeje: pásy se posouvají do strany */

</head>
<body>
<div id="live" class="sr" role="status" aria-live="polite"></div>
<div id="toast" class="toast" role="status"></div>
<section id="pair" hidden>
  <div class="box">
    <h2>Celý mix na iPadu</h2>
    <div class="hintline">V Mixtetu: Kapela › iPad – Celý mix. Opiš PIN, který je vedle QR kódu.</div>
    <input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="6" aria-label="PIN z Mixtetu" placeholder="000000">
    <div id="pairErr" class="err" role="alert"></div>
    <button id="pairGo" class="cta">Připojit</button>
  </div>
</section>
<div id="app" hidden>
  <header>
    <h1>Mixtet</h1>
    <span class="chip">Celý mix · iPad</span>
    <span class="chip st" id="st"><i></i><span id="stt">připojuji…</span><span class="hubn" id="hub"></span></span>
    <span class="grow"></span>
    <button class="tbtn" id="follow" aria-pressed="false">Sledovat Mac</button>
  </header>
  <div class="banner" id="banner" role="alert"></div>
  <main>
    <div class="strips" id="strips" role="group" aria-label="Kanály"></div>
    <aside class="side" aria-label="Živé akce a skupiny">
      <button id="talk" aria-pressed="false">MLUVIT KE KAPELE (drž)</button>
      <div class="hintline" id="talkHint">sál neslyší</div>
      <h2 id="grpH">Mute skupiny</h2>
      <div class="groups" id="groups" role="group" aria-labelledby="grpH"></div>
      <h2 id="dcaH">DCA</h2>
      <div class="dcas" id="dcas" role="group" aria-labelledby="dcaH"></div>
    </aside>
    <div class="lane mainl" id="mainBox" role="group" aria-label="Sál"></div>
  </main>
  <footer>
    <div class="banks" id="banks" role="group" aria-label="Banky pásů"></div>
    <span class="foot" id="foot">Mixtet ukazuje, kdo ovládá sál, a může tě odpojit.</span>
  </footer>
</div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const linkKey = (/^\/c\/([^/]+)/.exec(location.pathname) || [])[1] || '';
const STORE = 'krai.fullmix.' + linkKey;
let session = null, cfg = null, es = null, mixerOK = false, last = 0, lastM = 0;
let V = {}, K = {}, M = [];
const P = {};               // čeká na pult: adresa → {v, t}
const dragging = new Set();
const W = [];               // prvky k překreslení
const BANK = 8;             // pásů na banku (jako ovladač F1–F8)

// MARK: - zákon faderu (stejně jako XAirCodec)
const lin = f => { if (f <= 0) return -Infinity; if (f >= .5) return f*40-30; if (f >= .25) return f*80-50; if (f >= .0625) return f*160-70; return f*480-90; };
const q = f => Math.floor(Math.min(1, Math.max(0, f)) * 1023.5) / 1023;
const dbt = d => { if (!isFinite(d) || d < -89.5) return '−∞'; const r = Math.round(d * 10) / 10 || 0; return (r > 0 ? '+' : r < 0 ? '−' : '') + Math.abs(r).toFixed(1); };
const TOL = 0.007;
// stupnice: +10…−∞ padá na osminy dráhy (0 dB = 0.75)
const TICKS = [['+10', 1], ['+5', .875], ['0', .75], ['−5', .625], ['−10', .5], ['−20', .375], ['−30', .25], ['−50', .125], ['−∞', 0]];

// MARK: - hlášky
let tt = 0;
function say(t){ const l = $('live'); l.textContent = ''; setTimeout(() => { l.textContent = t; }, 30); }
function toast(msg, err){
  const e = $('toast'); e.textContent = msg; e.classList.toggle('err', !!err); e.classList.add('on'); say(msg);
  clearTimeout(tt); tt = setTimeout(() => e.classList.remove('on'), Math.max(err ? 5000 : 2800, msg.length * 65));
}
const online = () => mixerOK && Date.now() - last < 7000;
const offline = () => toast('Bez spojení – nic se neodeslalo', true);

// MARK: - API
function api(op){ return '/api/cs/' + session + '/' + op; }
function post(op, body){
  return fetch(api(op), {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)})
    .then(r => { if (r.status === 404) { lost(); return null; } return r.json(); }).catch(() => null);
}
let pend = {}, pt = 0;
function setVal(a, v){
  if (!online()) { offline(); return; }
  V[a] = v; P[a] = {v, t: Date.now()};
  pend[a] = v; if (!pt) pt = setTimeout(flush, 40);
  paint();
}
function flush(){ pt = 0; const p = pend; pend = {}; for (const a in p) post('set', {a, v: p[a]}).then(r => { if (!r || !r.ok) { revert(a); toast('Pult zápis nepřijal – vráceno', true); } }); }
function revert(a){ if (K[a] !== undefined) V[a] = K[a]; else delete V[a]; delete P[a]; paint(); }
setInterval(() => { const now = Date.now(); let n = 0;
  for (const a in P) { if (dragging.has(a)) continue; if (now - P[a].t > 1000) { revert(a); n++; } }
  if (n) toast('Pult nepotvrdil – vráceno na poslední hodnotu', true); }, 250);

// MARK: - prvky
const kn = a => V[a] !== undefined;
function dbToF(d){ if (d >= -10) return (d+30)/40; if (d >= -30) return (d+50)/80; if (d >= -60) return (d+70)/160; return (d+90)/480; }
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
/** Fader: svislý (pás) nebo vodorovný (DCA). Tah je relativní (nic neskočí pod prstem), šipky = ±1 dB. */
function fader(addr, color, label, horizontal){
  const f = el('div', horizontal ? 'hf' : 'fader'); f.style.setProperty('--cc', color || '');
  f.setAttribute('role', 'slider'); f.setAttribute('aria-label', label); f.tabIndex = 0;
  f.setAttribute('aria-orientation', horizontal ? 'horizontal' : 'vertical');
  let cap, fill = null;
  if (horizontal) { f.innerHTML = '<div class="rail"></div><div class="fill"></div><div class="knob"></div>'; fill = f.children[1]; cap = f.children[2]; }
  else {
    f.innerHTML = '<div class="track"></div>' + TICKS.map(() => '<div class="tk"></div>').join('') + '<div class="cap"></div>';
    cap = f.lastChild;
    f.querySelectorAll('.tk').forEach((t, i) => { t.style.top = pos(TICKS[i][1]); });
  }
  let start = 0, startV = 0, len = 1;
  f.addEventListener('pointerdown', e => {
    if (!kn(addr)) return;
    if (!online()) return offline();
    f.setPointerCapture(e.pointerId); dragging.add(addr);
    len = horizontal ? f.clientWidth - cap.offsetWidth : f.clientHeight - cap.offsetHeight;
    start = horizontal ? e.clientX : e.clientY; startV = V[addr];
  });
  f.addEventListener('pointermove', e => {
    if (!dragging.has(addr) || !f.hasPointerCapture(e.pointerId)) return;
    const d = horizontal ? e.clientX - start : start - e.clientY;
    setVal(addr, q(startV + d / Math.max(1, len)));
  });
  const end = () => { if (dragging.delete(addr) && P[addr]) P[addr].t = Date.now(); };
  f.addEventListener('pointerup', end); f.addEventListener('pointercancel', end);
  f.addEventListener('keydown', e => {   // šipky = ±1 dB (VoiceOver / klávesnice)
    const up = e.key === 'ArrowUp' || e.key === 'ArrowRight', down = e.key === 'ArrowDown' || e.key === 'ArrowLeft';
    if (!kn(addr) || (!up && !down)) return;
    e.preventDefault(); const d = lin(V[addr]) + (up ? 1 : -1);
    setVal(addr, d <= -90 ? 0 : q(dbToF(d)));
  });
  W.push(() => {
    f.classList.toggle('unknown', !kn(addr));
    if (kn(addr)) {
      if (horizontal) { const x = `calc(var(--kw) / 2 + (100% - var(--kw)) * ${V[addr].toFixed(4)})`; cap.style.left = x; fill.style.width = x; }
      else cap.style.top = pos(V[addr]);
    }
    f.setAttribute('aria-valuetext', kn(addr) ? dbt(lin(V[addr])) + ' dB' : 'neznámá');
  });
  return f;
}
/** Svislá poloha hodnoty 0–1 na dráze (střed jezdce). */
function pos(v){ return `calc(var(--krai-size-capHeightStage) / 2 + (100% - var(--krai-size-capHeightStage)) * ${(1 - v).toFixed(4)})`; }
function scale(){
  const s = el('div', 'scale'); s.setAttribute('aria-hidden', 'true');
  for (const [t, v] of TICKS) { const x = el('span', t === '0' ? 'z' : '', t); x.style.top = pos(v); s.append(x); }
  return s;
}
function valText(addr, cls){
  const e = el('div', cls || 'val'); e.setAttribute('aria-hidden', 'true');
  W.push(() => { e.classList.toggle('pend', !!P[addr]); e.textContent = kn(addr) ? dbt(lin(V[addr])) + (P[addr] ? '…' : '') : '—'; });
  return e;
}
function meter(i){ const m = el('div', 'meter'); m.innerHTML = '<i></i>'; m.dataset.m = i; m.setAttribute('aria-hidden', 'true'); return m; }
function muteBtn(addr, label){
  const b = el('button', 'lit');
  b.onclick = () => { if (!kn(addr)) return; if (!online()) return offline(); setVal(addr, V[addr] === 1 ? 0 : 1); };
  // text = stav: on 1 = zní → „MUTE“ nesvítí; on 0 = ztlumeno → svítí červeně (přímý mute)
  W.push(() => { const m = kn(addr) && V[addr] === 0; b.disabled = !kn(addr); b.classList.toggle('on', m);
    b.textContent = kn(addr) ? 'MUTE' : '—'; b.setAttribute('aria-pressed', m); b.setAttribute('aria-label', label + ' MUTE'); });
  return b;
}
/** Barva pásu = barva vlastníka (zákony v10 č. 1); bez vlastníka neutrální. */
function chColor(s){ return s.owner ? 'var(--krai-member-' + s.owner + ')' : ''; }
function lane(s, cls, color, label){
  const e = el('section', 'lane ' + cls); e.setAttribute('aria-label', label); e.dataset.id = s.id;
  if (color) e.style.setProperty('--cc', color);
  const fw = el('div', 'fw'); fw.append(scale(), fader(s.fader, color, label), meter(s.meter));
  return [e, fw];
}

// hub = Mac nebo iPad s Mixtetem (ADR-022, 17.6); slovo v pádech podle `hubKind` z init (starší server = Mac)
const HUB_WORDS = {mac: {nom: 'Mac', ins: 'Macem'}, ipad: {nom: 'iPad', ins: 'iPadem'}};
let HW = HUB_WORDS.mac;

function build(){
  W.length = 0;
  HW = HUB_WORDS[cfg.hubKind] || HUB_WORDS.mac;
  $('follow').textContent = 'Sledovat ' + HW.nom;
  $('foot').textContent = HW.nom + ' vidí „Sál ovládá: ' + HW.nom + ' + tablet“ a může tě odpojit.';
  $('hub').textContent = cfg.hub ? '· ' + cfg.hub : '';
  $('talkHint').textContent = (cfg.talkMic ? 'mikrofon ' + cfg.talkMic + ' · ' : '') + 'sál neslyší';
  const strips = $('strips'); strips.innerHTML = '';
  for (const s of cfg.strips) {
    const c = chColor(s);
    const [e, fw] = lane(s, 'strip', c, s.name);
    const tile = el('div', 'tile');
    tile.append(el('small', '', s.pair && /^\d+$/.test(s.short) ? s.short + '–' + (+s.short + 1) : s.short), el('b', '', s.name));
    if (s.pair) tile.title = 'stereo';
    if (s.owner) {
      tile.classList.add('has-own');   // iniciála vlastníka (jméno, když ho hub pošle; jinak číslo odposlechu)
      const o = el('span', 'own', s.ownerName ? s.ownerName.charAt(0) : String(s.owner));
      o.setAttribute('aria-label', s.ownerName ? 'patří: ' + s.ownerName : 'patří odposlechu ' + s.owner); tile.append(o);
    }
    const btns = el('div', 'btns'); btns.append(muteBtn(s.on, s.name));
    e.append(tile, fw, valText(s.fader), btns);
    strips.append(e);
  }
  // Sál – pás vpravo s MUTE
  const mb = $('mainBox'); mb.innerHTML = ''; mb.dataset.id = cfg.main.id;
  const fwm = el('div', 'fw'); fwm.append(scale(), fader(cfg.main.fader, '', 'Sál'), meter(cfg.main.meter));
  const tm = el('div', 'tile plain'); tm.append(el('small', '', 'LR'), el('b', '', 'Sál'));
  const bm = el('div', 'btns'); bm.append(muteBtn(cfg.main.on, 'Sál'));
  mb.append(tm, fwm, valText(cfg.main.fader), bm);
  // mute skupiny pultu 2×2: číslo, jméno kapely, svítí oranžově = skupina ztlumuje
  const g = $('groups'); g.innerHTML = '';
  for (const gr of cfg.groups) {
    const b = el('button', 'sk');
    b.innerHTML = '<b></b><span></span><em>ztlumuje</em>';
    b.children[0].textContent = gr.g; b.children[1].textContent = gr.name;
    b.setAttribute('aria-label', 'SK' + gr.g + ' ' + gr.name + ' – mute skupina');
    b.onclick = () => { if (!kn(gr.addr)) return; if (!online()) return offline(); setVal(gr.addr, V[gr.addr] === 1 ? 0 : 1); };
    W.push(() => { const on = V[gr.addr] === 1; b.disabled = !kn(gr.addr); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    g.append(b);
  }
  // DCA: jméno + dB, vodorovný fader, MUTE
  const d = $('dcas'); d.innerHTML = '';
  for (const x of cfg.dcas) {
    const nm = x.name || 'DCA';
    const row = el('div', 'dca'); row.setAttribute('role', 'group'); row.setAttribute('aria-label', nm);
    row.append(el('div', 'nm', nm), valText(x.fader, 'dv'), fader(x.fader, '', nm + ' hlasitost', true), muteBtn(x.on, nm));
    d.append(row);
  }
  buildBanks();
  paint();
}
function paint(){ for (const w of W) w(); }

// MARK: - banky: po 8 pásech; když se všechny vejdou, tlačítka zmizí. Pásy jdou posouvat i prstem.
let bankBtns = [];
function buildBanks(){
  const box = $('banks'); box.innerHTML = ''; bankBtns = [];
  const n = Math.ceil(cfg.strips.length / BANK);
  for (let k = 0; k < n; k++) {
    const first = cfg.strips[k * BANK], lastS = cfg.strips[Math.min(cfg.strips.length, (k + 1) * BANK) - 1];
    const b = el('button', 'bank', 'Banka ' + (k + 1));
    b.setAttribute('aria-label', 'Banka ' + (k + 1) + ': ' + first.name + ' – ' + lastS.name);
    b.onclick = () => gotoBank(k);
    box.append(b); bankBtns.push(b);
  }
  paintBanks();
}
function gotoBank(k){
  const sc = $('strips'), first = sc.children[k * BANK]; if (!first) return;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  sc.scrollTo({left: first.offsetLeft, behavior: reduce ? 'auto' : 'smooth'});
}
function paintBanks(){
  const sc = $('strips'), box = $('banks');
  if (!sc.children.length) return;
  const fits = sc.scrollWidth <= sc.clientWidth + 1;
  box.hidden = fits;
  let k = 0;
  if (sc.scrollLeft + sc.clientWidth >= sc.scrollWidth - 2) k = bankBtns.length - 1;
  else { const kids = [...sc.children]; const i = kids.findIndex(c => c.offsetLeft + c.offsetWidth / 2 >= sc.scrollLeft); k = Math.floor(Math.max(0, i) / BANK); }
  if (sc.scrollLeft < 2) k = 0;
  bankBtns.forEach((b, i) => b.setAttribute('aria-pressed', !fits && i === k));
}
$('strips').addEventListener('scroll', paintBanks, {passive: true});
if (window.ResizeObserver) new ResizeObserver(() => { paintBanks(); paint(); }).observe($('strips'));
else window.addEventListener('resize', () => { paintBanks(); paint(); });

// MARK: - Sledovat Mac (13.6): výběr pásu na Macu posune iPad na ten pás a zvýrazní ho; jednosměrně
let follow = false; try { follow = localStorage.getItem(STORE + '.follow') === '1'; } catch (e) {}
function paintFollow(){ const b = $('follow'); b.classList.toggle('on', follow); b.setAttribute('aria-pressed', follow); }
$('follow').onclick = () => { follow = !follow; try { localStorage.setItem(STORE + '.follow', follow ? '1' : '0'); } catch (e) {}
  paintFollow(); if (follow && cfg) select(cfg.selected); };
function select(id){
  if (cfg) cfg.selected = id;
  document.querySelectorAll('.lane[data-id]').forEach(e => e.classList.toggle('sel', follow && e.dataset.id === id));
  if (!follow) return;
  const e = document.querySelector('.strip[data-id="' + CSS.escape(id) + '"]');
  if (e) e.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', inline: 'center', block: 'nearest'});
}
paintFollow();
function paintMeters(){
  const stale = !online() || Date.now() - lastM > 1500;   // zákon 7: při výpadku nulovat a šrafovat
  document.querySelectorAll('.meter').forEach(m => {
    const db = stale ? -90 : (M[+m.dataset.m] ?? -90);
    m.firstChild.style.height = (100 - Math.max(0, Math.min(100, (db + 60) / 60 * 100))) + '%';
    m.classList.toggle('stale', stale);
  });
}

// MARK: - MLUVIT KE KAPELE (drž) – pustit při zvednutí prstu, ztrátě fokusu i skrytí stránky (zákon v10 č. 7)
let talking = false, talkTimer = 0;
function talk(on){
  if (on && !online()) return offline();
  if (on === talking) return;
  talking = on; const t = $('talk'); t.classList.toggle('on', on); t.setAttribute('aria-pressed', on);
  t.textContent = on ? 'MLUVÍŠ KE KAPELE' : 'MLUVIT KE KAPELE (drž)';
  clearInterval(talkTimer);
  post('talk', {on}).then(r => { if (on && (!r || !r.ok)) { talk(false); toast('Teď mluví někdo jiný – zkus to za chvíli', true); } });
  if (on) talkTimer = setInterval(() => post('talk', {on: true}), 500);   // obnova pro hlídání na hubu (2 s)
}
$('talk').addEventListener('pointerdown', e => { e.preventDefault(); talk(true); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => $('talk').addEventListener(t, () => talk(false)));
// VoiceOver / klávesnice: aktivace přepíná (zákon v10 č. 7); ukazatel jde přes pointerdown/up výše
$('talk').addEventListener('click', e => { if (e.detail === 0) talk(!talking); });
$('talk').addEventListener('blur', () => talk(false));
window.addEventListener('blur', () => talk(false));
document.addEventListener('visibilitychange', () => { if (document.hidden) talk(false); });

// MARK: - spojení
function status(){
  const age = Date.now() - last, lost = age > 7000, st = $('st');
  st.className = 'chip st ' + (lost ? '' : mixerOK ? 'ok' : 'warn');
  $('stt').textContent = lost ? 'Spojení s ' + HW.ins + ' ztraceno' : mixerOK ? 'připojeno' : 'pult neodpovídá';
  document.body.classList.toggle('dis', !online());
  const b = $('banner'); b.style.display = online() ? 'none' : 'block';
  b.textContent = lost ? 'Spojení s ' + HW.ins + ' ztraceno – odposlechy hrají dál, sál se nedá měnit.' : 'Pult neodpovídá – nic se neodesílá.';
  paintMeters();
  if (age > 9000 && !document.hidden && session) connect();
}
function connect(){
  if (es) es.close(); last = Date.now();
  es = new EventSource(api('events'));
  es.addEventListener('init', ev => { cfg = JSON.parse(ev.data); V = Object.assign({}, cfg.values); K = Object.assign({}, cfg.values);
    for (const a in P) delete P[a]; mixerOK = cfg.connected; last = Date.now(); build(); status(); select(cfg.selected); });
  es.addEventListener('sel', ev => { last = Date.now(); select(JSON.parse(ev.data).id); });
  es.addEventListener('p', ev => { const d = JSON.parse(ev.data); last = Date.now(); K[d.a] = d.v;
    const p = P[d.a]; if (p) { if (Math.abs(p.v - d.v) <= TOL) { delete P[d.a]; paint(); } return; }
    if (dragging.has(d.a)) return; V[d.a] = d.v; paint(); });
  es.addEventListener('m', ev => { M = JSON.parse(ev.data); last = lastM = Date.now(); paintMeters(); });
  es.addEventListener('ping', ev => { last = Date.now(); mixerOK = JSON.parse(ev.data).connected; status(); });
  es.addEventListener('reload', () => connect());
  es.addEventListener('bye', () => { lost(HW.nom + ' tě odpojil – sál z tabletu ovládat nejde.'); });
}
setInterval(status, 1000);

// MARK: - párování (PIN z Macu)
function lost(msg){
  talk(false); if (es) { es.close(); es = null; }
  session = null; try { localStorage.removeItem(STORE); } catch (e) {}
  showPair(msg || 'Odkaz nebo připojení už neplatí – opiš PIN z Mixtetu znovu.');
}
function showPair(msg){ $('app').hidden = true; $('pair').hidden = false; $('pairErr').textContent = msg || ''; $('pin').value = ''; $('pin').focus(); }
let lockTimer = 0;
async function claim(){
  const pin = $('pin').value.replace(/\D/g, '');
  if (pin.length !== 6) { $('pairErr').textContent = 'PIN má 6 číslic.'; return; }
  let r = null, s = 0;
  try { const res = await fetch('/api/c/' + encodeURIComponent(linkKey) + '/claim', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({pin, device: /iPad/.test(navigator.userAgent) ? 'iPad' : 'Tablet'})}); s = res.status; r = await res.json(); } catch (e) {}
  if (s === 200 && r && r.session) {
    session = r.session; try { localStorage.setItem(STORE, session); } catch (e) {}
    $('pair').hidden = true; $('app').hidden = false; connect(); return;
  }
  const err = $('pairErr');
  if (s === 403) err.textContent = 'Špatný PIN – zbývá ' + r.left + (r.left === 1 ? ' pokus' : ' pokusy') + '.';
  else if (s === 429) { let n = r.retry; clearInterval(lockTimer); $('pairGo').disabled = true;
    const tick = () => { err.textContent = 'Moc pokusů – zkus to znovu za ' + n + ' s.'; if (--n < 0) { clearInterval(lockTimer); $('pairGo').disabled = false; err.textContent = ''; } };
    tick(); lockTimer = setInterval(tick, 1000); }
  else if (s === 409) err.textContent = 'Sál už ovládá jiný tablet – v Mixtetu ho nejdřív odpoj.';
  else if (s === 404) err.textContent = 'Odkaz už neplatí – naskenuj nový QR kód v Mixtetu.';
  else err.textContent = 'Mixtet neodpovídá – jsi ve stejné Wi‑Fi?';
}
$('pairGo').onclick = claim;
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') claim(); });

(function boot(){
  try { session = localStorage.getItem(STORE); } catch (e) {}
  if (session) { $('app').hidden = false; connect(); } else showPair('');
})();
</script>
